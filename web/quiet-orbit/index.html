<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiet Orbit</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06070a;color:#e8edf7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}.hud{position:fixed;left:20px;top:18px;z-index:2;pointer-events:none}.hud h1{margin:0 0 6px;font-size:20px;letter-spacing:.08em}.hud p{margin:0;color:#9ca8b8;font-size:13px;line-height:1.6}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border:1px solid #2a3140;border-radius:999px;color:#cbd5e1;background:rgba(10,12,18,.55)}
  </style>
</head>
<body>
  <div class="hud">
    <h1>QUIET ORBIT</h1>
    <p>移动鼠标：改变引力中心<br>点击：制造一次能量脉冲<br>按空格：重置宇宙</p>
    <span class="badge">ai-coding-lab / experiment 001</span>
  </div>
  <canvas id="c"></canvas>
<script>
const canvas = document.querySelector('#c');
const ctx = canvas.getContext('2d');
let w=0,h=0,dpr=1;
let particles=[];
const mouse={x:0,y:0,active:false};
let pulse=0;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  w=innerWidth;h=innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  reset();
}

function reset(){
  particles=[];
  const count=Math.min(420,Math.floor((w*h)/3500));
  const cx=w/2,cy=h/2;
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const radius=Math.pow(Math.random(),.58)*Math.min(w,h)*.44+30;
    const speed=(0.35+Math.random()*0.8)*(radius/180+0.4);
    particles.push({
      x:cx+Math.cos(angle)*radius,
      y:cy+Math.sin(angle)*radius,
      vx:-Math.sin(angle)*speed,
      vy: Math.cos(angle)*speed,
      r:Math.random()*1.35+.35,
      life:Math.random()*1000
    });
  }
  mouse.x=cx;mouse.y=cy;
}

function tick(){
  ctx.fillStyle='rgba(6,7,10,.17)';
  ctx.fillRect(0,0,w,h);
  const gx=mouse.active?mouse.x:w/2;
  const gy=mouse.active?mouse.y:h/2;
  pulse*=0.955;

  for(const p of particles){
    const dx=gx-p.x,dy=gy-p.y;
    const dist2=dx*dx+dy*dy+140;
    const dist=Math.sqrt(dist2);
    const force=Math.min(0.065,32/dist2);
    p.vx+=dx/dist*force;
    p.vy+=dy/dist*force;

    if(pulse>0){
      const pdx=p.x-gx,pdy=p.y-gy;
      const pd=Math.sqrt(pdx*pdx+pdy*pdy)+1;
      if(pd<260){
        const kick=(1-pd/260)*pulse;
        p.vx+=pdx/pd*kick;
        p.vy+=pdy/pd*kick;
      }
    }

    p.vx*=0.999;p.vy*=0.999;
    p.x+=p.vx;p.y+=p.vy;p.life+=1;

    if(p.x<-60||p.x>w+60||p.y<-60||p.y>h+60){
      const a=Math.random()*Math.PI*2;
      const radius=Math.min(w,h)*.36;
      p.x=w/2+Math.cos(a)*radius;
      p.y=h/2+Math.sin(a)*radius;
      p.vx=-Math.sin(a)*.7;
      p.vy= Math.cos(a)*.7;
    }

    const speed=Math.hypot(p.vx,p.vy);
    const alpha=Math.min(.9,.22+speed*.18);
    ctx.beginPath();
    ctx.fillStyle=`rgba(220,232,255,${alpha})`;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.beginPath();
  ctx.strokeStyle='rgba(180,200,255,.12)';
  ctx.arc(gx,gy,18+Math.sin(performance.now()/450)*3,0,Math.PI*2);
  ctx.stroke();
  requestAnimationFrame(tick);
}

addEventListener('resize',resize);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
addEventListener('mouseleave',()=>mouse.active=false);
addEventListener('click',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;pulse=4.2});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();reset();}});
resize();tick();
</script>
</body>
</html>
