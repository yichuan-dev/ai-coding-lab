name: BOSS Android APK
on:
  push:
    branches: [boss-android]
    paths: ['boss-assistant/**', '.github/workflows/boss-android.yml']
  pull_request:
    paths: ['boss-assistant/**', '.github/workflows/boss-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: boss-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check public source for private artifacts
        run: python3 scripts/check_source_privacy.py
      - name: Test and build installable preview APK
        run: gradle :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-assistant-preview-apk-and-reports
          path: |
            boss-assistant/app/build/outputs/apk/debug/*.apk
            boss-assistant/core/build/reports/tests/test/
            boss-assistant/app/build/reports/lint-results-debug.html
          retention-days: 14
