plugins { id 'com.android.application' }
android {
    namespace 'cn.local.jobassistant'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.local.jobassistant'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'cn.local.jobassistant.DeviceTests'
    }
    signingConfigs {
        localRelease {
            if (System.getenv('ASSISTANT_SIGNING_FILE')) {
                storeFile file(System.getenv('ASSISTANT_SIGNING_FILE'))
                storePassword System.getenv('ASSISTANT_SIGNING_PASSWORD')
                keyAlias 'assistant'
                keyPassword System.getenv('ASSISTANT_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.preview'; resValue 'string', 'app_name', '求职助手预览' }
        release { signingConfig signingConfigs.localRelease; minifyEnabled false; resValue 'string', 'app_name', '求职助手' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
}
dependencies {
    implementation project(':core')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
